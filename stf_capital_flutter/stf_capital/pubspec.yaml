name: stf_capital
description: STF Capital - Financial Services Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.2
  
  # Navigation
  go_router: ^17.1.0
  
  # Firebase / Backend (UPDATED - compatible set)
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  
  # File picking
  file_picker: ^10.3.10
  
  # Image / file handling
  path_provider: ^2.1.3
  
  # UI
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  lottie: ^3.1.2
  cached_network_image: ^3.4.0
  
  # Utils
  intl: ^0.20.2
  uuid: ^4.4.0
  shared_preferences: ^2.2.3
  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  