name: china_stall_market_place
description: China Stall Market Place — Multi-vendor marketplace for iOS & Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── HTTP & State ───────────────────────────────────────────────────────
  http: ^1.2.1
  provider: ^6.1.1
  postgres: ^3.0.6

  # ─── Security & Auth ────────────────────────────────────────────────────
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.0.0
  crypto: ^3.0.3

  # ─── Navigation ─────────────────────────────────────────────────────────
  go_router: ^17.1.0

  # ─── Networking & Connectivity ──────────────────────────────────────────
  connectivity_plus: ^7.0.0

  # ─── Local Storage ──────────────────────────────────────────────────────
  shared_preferences: ^2.3.5

  # ─── UI / Widgets ───────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  badges: ^3.1.2
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^2.0.1
  flutter_rating_bar: ^4.0.1
  flutter_staggered_grid_view: ^0.7.0

  # ─── Media ──────────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

  # ─── Maps & Location ────────────────────────────────────────────────────
  google_maps_flutter: ^2.7.0
  geolocator: ^14.0.2

  # ─── Payments ───────────────────────────────────────────────────────────
  webview_flutter: ^4.8.0

  # ─── File Handling ──────────────────────────────────────────────────────
  file_picker: ^10.3.10

  # ─── Device Info ────────────────────────────────────────────────────────
  device_info_plus: ^12.3.0

  # ─── Permissions ────────────────────────────────────────────────────────
  permission_handler: ^12.0.1

  # ─── Utils ──────────────────────────────────────────────────────────────
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  uuid: ^4.5.1
  flutter_dotenv: ^5.1.0

  firebase_core: ^3.10.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1
  
  # ─── Icons & Fonts ──────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  supabase_flutter: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  sign_in_with_apple: ^7.0.1

flutter:
  uses-material-design: true
  assets:
    - .env
