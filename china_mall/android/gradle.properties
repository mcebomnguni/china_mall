# JVM Memory - tuned down for low-RAM Windows machines
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=384M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Gradle settings - DISABLE daemon to prevent crashes
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.workers.max=2
org.gradle.vfs.watch=false

# Android
android.useAndroidX=true
# Keep Jetifier true only if you have very old libraries; otherwise false saves memory
android.enableJetifier=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvm.options=-Xmx512m
kotlin.compiler.execution.strategy=in-process
