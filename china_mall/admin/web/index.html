<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="China Stall Admin Dashboard">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>China Stall — Admin</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background-color: #0F2419; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; flex-direction: column; gap: 16px;
      background: #0F2419;
    }
    #loading p { color: #ffffff80; font-family: sans-serif; font-size: 14px; margin: 0; }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #1D6B4640;
      border-top-color: #1D6B46;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>China Stall Admin</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      document.getElementById('loading').remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
